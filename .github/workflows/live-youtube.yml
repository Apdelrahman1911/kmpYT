name: Approved YouTube channel tests

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: Optional video from @oPiiLz; blank discovers an approved channel video
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: approved-youtube-live
  cancel-in-progress: false

jobs:
  live:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      KMPYT_LIVE_TESTS: 'true'
      KMPYT_LIVE_VIDEO_URL: ${{ inputs.video_url }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        id: checkout
        with:
          persist-credentials: false
          set-safe-directory: false
          submodules: false
      - name: Verify approved channel without cached live responses
        shell: bash
        run: |
          ci/scoped.sh bash -euo pipefail -c '
            source ci/select-tools.sh jvm
            ci/gradle.sh :kmpyt:jvmTest --rerun --tests dev.kmpyt.ci.ApprovedChannelLiveTest --stacktrace
            python3 -B ci/summary.py --require-executed
          '
      - name: Report counts only (no media/artifact/cache upload)
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        shell: bash
        env:
          KMPYT_CI_JOB_STATUS: ${{ job.status }}
        run: ci/scoped.sh python3 -B ci/summary.py
