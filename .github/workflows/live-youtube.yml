name: Approved YouTube channel tests

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: Optional video from @oPiiLz; blank discovers an approved channel video
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: approved-youtube-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KMPYT_LIVE_TESTS: 'true'
      KMPYT_LIVE_VIDEO_URL: ${{ inputs.video_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare media tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Verify approved channel metadata and media transfer
        run: ./gradlew :kmpyt:jvmTest --tests dev.kmpyt.ci.ApprovedChannelLiveTest --stacktrace
      - name: Upload redacted test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approved-channel-results
          path: |
            kmpyt/build/reports/live/
            kmpyt/build/test-results/jvmTest/
          retention-days: 14
