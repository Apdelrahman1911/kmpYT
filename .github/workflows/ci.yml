name: Cross-platform CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: Full required matrix or one manually authorized Windows startup discriminator
        type: choice
        required: true
        default: full
        options: [full, windows-startup-probe]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'windows-startup-probe' && 'ci-windows-startup-probe-' || 'ci-' }}${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  license:
    if: ${{ github.event.repository.private == false && (github.event_name != 'workflow_dispatch' || inputs.mode != 'windows-startup-probe') }}
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'windows-startup-probe' && 'Probe scope - license gate not executed' || 'License and provenance policy' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1; reviewed credential path
        with:
          persist-credentials: false
          set-safe-directory: false
          submodules: false
      - name: Verify complete approved MIT grant and retained third-party notices
        run: ci/scoped.sh python3 -B ci/verify-license.py
      - name: Check scoped tooling and fail-closed native preflights
        run: ci/scoped.sh python3 -B ci/test-tooling.py

  jvm:
    if: ${{ github.event.repository.private == false && (github.event_name != 'workflow_dispatch' || inputs.mode != 'windows-startup-probe') }}
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'windows-startup-probe' && 'Probe scope - JVM gates not executed' || 'JVM' }} (${{ matrix.check_name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Preserve existing status-check names; pin actual standard labels.
          - {check_name: ubuntu-latest, runner: ubuntu-24.04}
          - {check_name: windows-latest, runner: windows-2022}
          - {check_name: macos-15-intel, runner: macos-15-intel}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        id: checkout
        with:
          persist-credentials: false
          set-safe-directory: false
          submodules: false
      - name: Verify shared and desktop code with read-only or pinned repository-owned tools
        run: |
          ci/scoped.sh bash -euo pipefail -c '
            source ci/select-tools.sh jvm
            ci/gradle.sh :kmpyt:jvmTest :kmpyt:jvmJar --stacktrace
            python3 -B ci/summary.py --require-executed --require-media
          '
      - name: Summarize without artifact/cache uploads
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        env:
          KMPYT_CI_JOB_STATUS: ${{ job.status }}
        run: ci/scoped.sh python3 -B ci/summary.py

  android:
    if: ${{ github.event.repository.private == false && (github.event_name != 'workflow_dispatch' || inputs.mode != 'windows-startup-probe') }}
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'windows-startup-probe' && 'Probe scope - Android gates not executed' || 'Android API' }} ${{ matrix.api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    env:
      KMPYT_ANDROID_TEST_API: ${{ matrix.api }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        id: checkout
        with:
          persist-credentials: false
          set-safe-directory: false
          submodules: false
      - name: Build and lint Android with read-only installed SDK
        run: |
          ci/scoped.sh bash -euo pipefail -c '
            source ci/select-tools.sh
            sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
            test -f "$sdk/platforms/android-36/android.jar"
            test -d "$sdk/build-tools/35.0.0"
            ci/gradle.sh :kmpyt:assembleRelease :kmpyt:lintRelease --stacktrace
          '
      - name: Compile Android instrumented-test sources without starting a device
        if: ${{ always() && !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          ci/scoped.sh bash -euo pipefail -c '
            source ci/select-tools.sh
            ci/gradle.sh :kmpyt:compileDebugAndroidTestKotlinAndroid --stacktrace
          '
      - name: Required API instrumentation (fails before unaudited native launch)
        if: ${{ always() && !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          ci/scoped.sh bash -euo pipefail -c '
            source ci/select-tools.sh
            ci/native-boundary.sh android
            ci/gradle.sh :kmpyt:connectedDebugAndroidTest --stacktrace
            python3 -B ci/summary.py --require-executed
          '
      - name: Summarize without artifact/cache uploads
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        env:
          KMPYT_CI_JOB_STATUS: ${{ job.status }}
        run: ci/scoped.sh python3 -B ci/summary.py

  apple:
    if: ${{ github.event.repository.private == false && (github.event_name != 'workflow_dispatch' || inputs.mode != 'windows-startup-probe') }}
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'windows-startup-probe' && 'Probe scope - iOS gates not executed' || 'iOS simulator and XCFramework' }}
    runs-on: macos-15-intel
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        id: checkout
        with:
          persist-credentials: false
          set-safe-directory: false
          submodules: false
      - name: Build simulator framework using pinned read-only Xcode
        run: |
          ci/scoped.sh bash -euo pipefail -c '
            source ci/select-tools.sh
            xcodebuild -version
            ci/gradle.sh :kmpyt:linkDebugFrameworkIosX64 --stacktrace
          '
      - name: Compile iOS simulator test sources without starting CoreSimulator
        if: ${{ always() && !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          ci/scoped.sh bash -euo pipefail -c '
            source ci/select-tools.sh
            ci/gradle.sh :kmpyt:compileTestKotlinIosX64 --stacktrace
          '
      - name: Required native iOS protocols and media processing
        if: ${{ always() && !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          ci/scoped.sh bash -euo pipefail -c '
            source ci/select-tools.sh
            ci/native-boundary.sh ios
            ci/gradle.sh :kmpyt:iosX64Test "-PiosSimulatorDevice=$IOS_DEVICE" --stacktrace
          '
      - name: Required WebKit UIKit-hosted tests
        if: ${{ always() && !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          ci/scoped.sh bash -euo pipefail -c '
            source ci/select-tools.sh
            ci/native-boundary.sh ios
            command -v xcodegen
            export KMPYT_FRAMEWORK="$KMPYT_CI_PROJECT_ROOT/kmpyt/build/bin/iosX64/debugFramework/KmpYT.framework"
            xcodegen generate --spec ci/ios-host/project.yml --project ci/ios-host
            xcodebuild -project ci/ios-host/KmpYTHost.xcodeproj -scheme KmpYTHost -configuration Debug -destination "id=$IOS_DEVICE" -derivedDataPath "$KMPYT_CI_WORK_ROOT/xcode/DerivedData" -resultBundlePath "$KMPYT_CI_WORK_ROOT/xcode/results/ios-host.xcresult" -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test
          '
      - name: Assemble release XCFramework independently of runtime boundary
        if: ${{ always() && !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          ci/scoped.sh bash -euo pipefail -c '
            source ci/select-tools.sh
            ci/gradle.sh :kmpyt:assembleKmpYTReleaseXCFramework --stacktrace
          '
      - name: Summarize without artifact/cache uploads
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        env:
          KMPYT_CI_JOB_STATUS: ${{ job.status }}
        run: ci/scoped.sh python3 -B ci/summary.py

  windows_startup_probe:
    if: ${{ github.event.repository.private == false && github.event_name == 'workflow_dispatch' && inputs.mode == 'windows-startup-probe' }}
    name: Windows startup discriminator (one authored test)
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        id: checkout
        with:
          persist-credentials: false
          set-safe-directory: false
          submodules: false
      - name: Verify license and browser-free diagnostic regressions
        run: |
          # Native Windows Python must not resolve bare bash to the WSL launcher.
          # Bind the Git Bash already running this step; no PATH/system changes.
          case "$(uname -s)" in MINGW*|MSYS*) ;; *) printf '%s\n' 'Git Bash is required for this Windows probe.' >&2; exit 78 ;; esac
          tooling_bash="$(cygpath -am "$BASH")"
          case "$tooling_bash" in *.[Ee][Xx][Ee]) ;; *) tooling_bash="$tooling_bash.exe" ;; esac
          test -f "$tooling_bash"
          export KMPYT_TEST_BASH="$tooling_bash"
          ci/scoped.sh python3 -B ci/verify-license.py
          ci/scoped.sh python3 -B ci/test-tooling.py
      - name: Read-only admission then exactly one production-path authored Chromium test
        run: |
          ci/scoped.sh bash -euo pipefail -c '
            source ci/select-tools.sh windows-startup-probe
            python3 -B ci/windows-browser-preflight.py
            ci/gradle.sh :kmpyt:jvmTest --tests "dev.kmpyt.jvm.DesktopYouTubeJavaScriptRuntimeTest.executesNativeDomAndUrlOperationsInOfflineChromium" --stacktrace
            python3 -B ci/summary.py --require-startup-probe
          '
      - name: Summarize without artifact/cache uploads
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        env:
          KMPYT_CI_JOB_STATUS: ${{ job.status }}
        run: ci/scoped.sh python3 -B ci/summary.py
