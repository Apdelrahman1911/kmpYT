name: Cross-platform CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    name: JVM (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select configured Node runtime
        shell: bash
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'KMPYT_NODE=' + process.execPath + '\n')"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Linux media tooling
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          echo "KMPYT_FFMPEG=$(command -v ffmpeg)" >> "$GITHUB_ENV"
      - name: Install macOS media tooling
        if: runner.os == 'macOS'
        run: |
          command -v ffmpeg || brew install ffmpeg
          echo "KMPYT_FFMPEG=$(command -v ffmpeg)" >> "$GITHUB_ENV"
      - name: Install Windows media tooling
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg --yes --no-progress }
          $mediaTool = (Get-Command ffmpeg -ErrorAction Stop).Source
          "KMPYT_FFMPEG=$mediaTool" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify shared and desktop code
        shell: bash
        run: ./gradlew :kmpyt:jvmTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jvm-reports-${{ matrix.os }}
          path: |
            kmpyt/build/reports/tests/
            kmpyt/build/test-results/

  android:
    name: Android API ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :kmpyt:connectedDebugAndroidTest :kmpyt:assembleRelease :kmpyt:lintRelease --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports-api-${{ matrix.api }}
          path: |
            kmpyt/build/reports/
            kmpyt/build/outputs/androidTest-results/
            kmpyt/build/outputs/aar/

  apple:
    name: iOS simulator and XCFramework
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Select installed Apple tooling
        run: |
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          fi
          xcodebuild -version
          echo "XCODE_VERSION=$(xcodebuild -version | head -n 1 | cut -d ' ' -f 2)" >> "$GITHUB_ENV"
          if [ "$(uname -m)" = arm64 ]; then
            echo 'IOS_TEST_TASK=iosSimulatorArm64Test' >> "$GITHUB_ENV"
          else
            echo 'IOS_TEST_TASK=iosX64Test' >> "$GITHUB_ENV"
          fi
          xcrun simctl list devices available
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))["devices"]
          candidates = [d for runtime, values in devices.items() if ".iOS-" in runtime for d in values if d.get("isAvailable") and d["name"].startswith("iPhone")]
          if not candidates:
              raise SystemExit("No available iPhone simulator was installed on the runner")
          selected = candidates[0]
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("IOS_DEVICE=" + selected["udid"] + "\n")
          print("Selected simulator:", selected["name"], selected["udid"])
          PY
      - name: Restore Kotlin Native toolchain
        id: konan
        uses: actions/cache/restore@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-2.2.21-${{ env.XCODE_VERSION }}
      - name: Boot the selected simulator
        run: |
          xcrun simctl boot "$IOS_DEVICE" || true
          xcrun simctl bootstatus "$IOS_DEVICE" -b
      - name: Test native iOS protocols and media processing
        run: ./gradlew ":kmpyt:$IOS_TEST_TASK" "-PiosSimulatorDevice=$IOS_DEVICE" --stacktrace
      - name: Assemble Swift framework
        id: framework
        if: always() && !cancelled()
        run: ./gradlew :kmpyt:assembleKmpYTReleaseXCFramework --stacktrace
      - name: Test WebKit in a UIKit application host
        if: ${{ !cancelled() && steps.framework.outcome == 'success' }}
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen generate --spec ci/ios-host/project.yml --project ci/ios-host
          xcodebuild -project ci/ios-host/KmpYTHost.xcodeproj -scheme KmpYTHost -configuration Debug -destination "id=$IOS_DEVICE" -derivedDataPath kmpyt/build/iosHost -resultBundlePath kmpyt/build/reports/ios-host.xcresult -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test
      - name: Save Kotlin Native toolchain
        if: always() && steps.konan.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.konan
          key: ${{ steps.konan.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-framework-and-reports
          path: |
            kmpyt/build/XCFrameworks/
            kmpyt/build/reports/tests/
            kmpyt/build/test-results/
            kmpyt/build/reports/ios-host.xcresult/
